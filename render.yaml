services:
  - type: web
    name: prototype-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: Downloads/project/backend3
    dockerfilePath: Downloads/project/backend3/Dockerfile
    dockerContext: Downloads/project/backend3
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: scripts
      - key: CORS_ALLOWED_ORIGINS
        sync: false
